name: build

# Manual only for now: GitHub Actions is unavailable on this account (billing),
# and the local harness (tools/test.ps1) is the primary check. Add push/pull_request
# triggers back once Actions minutes are available.
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: pwsh
        # Game data is never in the repo, so data-dependent tests skip on CI.
        run: ./tools/test.ps1 -Preset release
      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: build/release/test-output
